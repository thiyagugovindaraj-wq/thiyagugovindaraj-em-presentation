  <canvas id="chart" role="img" aria-label="Bar chart by date, August 2026, all five metrics">Daily values for August 2026 across occupancy, cancellation, actual occupancy, actual cancellation, and transfer percentage.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>

["09-08-2026",54.96,22.85,5.45,17.4,37.56],["10-08-2026",51.34,26.7,5.75,20.95,30.39],
["11-08-2026",43.44,24.41,5.37,19.04,24.4],["12-08-2026",43.11,24.45,6.47,17.98,25.13],

const labels = raw.map(r => r[0].slice(0,2));
const occ = raw.map(r => r[1]);
const canc = raw.map(r => r[2]);
const trf = raw.map(r => r[3]);
const actCanc = raw.map(r => r[4]);
const actOcc = raw.map(r => r[5]);

const colors = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4'];
const datasets = [
  { label: 'Booked occupancy %', data: occ, backgroundColor: colors[0] },
  { label: 'Actual occupancy %', data: actOcc, backgroundColor: colors[1] },
  { label: 'Booked cancellation %', data: canc, backgroundColor: colors[2] },
  { label: 'Actual cancellation %', data: actCanc, backgroundColor: colors[3] },
  { label: 'Transfer %', data: trf, backgroundColor: colors[4] }
].map(d => ({...d, borderRadius: 3, maxBarThickness: 7}));

const ctx = document.getElementById('chart');
new Chart(ctx, {
  type: 'bar',
  data: { labels, datasets },
  options: {
    responsive: true, maintainAspectRatio: false,
    scales: {
      x: { ticks: { autoSkip: true, maxRotation: 0, color: '#898781' }, grid: { display: false } },
      y: { ticks: { color: '#898781' }, grid: { color: '#e1e0d9' }, title: { display: true, text: '%', color: '#898781' } }
    },
    plugins: { legend: { display: false }, tooltip: { callbacks: { title: (items) => 'Aug ' + items[0].label } } }
  }
});

const legend = document.getElementById('legend');
datasets.forEach(d => {
  const span = document.createElement('span');
  span.style.cssText = 'display:flex;align-items:center;gap:4px;';
  span.innerHTML = '<span style="width:10px;height:10px;border-radius:2px;background:' + d.backgroundColor + ';"></span>' + d.label;
  legend.appendChild(span);
});
</script>
